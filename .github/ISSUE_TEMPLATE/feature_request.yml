name: Feature request
description: Suggest an API change or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      render: js
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
