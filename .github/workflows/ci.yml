name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - name: Health check
        env:
          AFFIX_API_KEY: ${{ secrets.AFFIX_API_KEY }}
          AFFIX_API_BASE: https://api.affix-io.com
        run: |
          if [ -z "${AFFIX_API_KEY}" ]; then
            echo "Skipping live health (set repository secret AFFIX_API_KEY)"
            exit 0
          fi
          node dist/cli.js health
